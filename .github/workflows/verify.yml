name: verify

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Match the publish toolchain while retaining bundled-npm coverage on Node 22.
      - if: matrix.node == 24
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run verify

  consumer-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Build tools use Node 24; the packed public API must still work on the minimum supported Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - run: npm run test:consumer

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium firefox webkit
      - run: bash scripts/setup-ci-audio.sh
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
